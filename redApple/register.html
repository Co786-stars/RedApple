<!DOCTYPE html>
<html lang="en">
<head>
    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TITLE -->
    <title>Registration Form</title>

    <!-- FAVICON -->
    <link rel="icon" href="favicon2.png" type="image/x-icon">

    <!-- BOOTSTRAP $ CUSTOM CSS -->
    <link rel="stylesheet" href="css/register.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

	<!--BOOTSTREAP & JS LINKS  -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>

</head>


<body class="body">

    <div class="form-container">

        <form id="form" action="#" method="post" enctype="multipart/form-data">

            <!-- BASIC INFORMATION -->
            <div class="form-section mb-4">

                <h5 class="text-success">Basic Information</h5>

                <div class="row g-3">

                    <div class="col-md-4">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" name="fnames" class="form-control"
                               placeholder="Enter first name" autocomplete="given-name">
                    </div>

                    <div class="col-md-4">
                        <label for="mname">Middle Name</label>
                        <input type="text" id="mname" name="mnames" class="form-control"
                               placeholder="Middle name" autocomplete="additional-name">
                    </div>

                    <div class="col-md-4">
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" name="lnames" class="form-control"
                               placeholder="Last name" autocomplete="family-name">
                    </div>

                </div>

                <div class="row g-3 mt-3">

                    <div class="col-md-4">
                        <label for="birthday">Date of Birth</label>
                        <input type="date" id="birthday" name="bd" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label for="country">Country</label>
                        <select id="country" name="country" class="form-select">
                            <option value="" disabled selected>country</option>
                            <option value="India">India</option>
                            <option value="Australia">Australia</option>
                            <option value="Sri Lanka">Sri Lanka</option>
                            <option value="Zimbabwe">Zimbabwe</option>
                            <option value="Switzerland">Switzerland</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="eid">Email ID</label>
                        <input type="email" id="eid" name="eid" class="form-control"
                               placeholder="email@gmail.com" autocomplete="email">
                    </div>

                </div>

                <div class="row g-3 mt-3">

                    <div class="col-md-4">
                        <label for="telnum">Contact Number</label>
                        <input type="tel" id="telnum" name="telnum" class="form-control"
                               placeholder="Contact number" autocomplete="tel">
                    </div>

                    <div class="col-md-4">
                        <label for="yexp">Year Experience</label>
                        <input type="number" id="yexp" name="exprience" class="form-control"
                               min="0" max="50" value="0" placeholder="Years">
                    </div>

                </div>

                <!-- GENDER -->
                <div class="mt-4">
                    <label class="d-block mb-2">Gender</label>

                    <div class="d-flex gap-4 flex-wrap">

                        <div class="form-check">
                            <input type="radio" id="opt1" name="rdbtn" value="Male" class="form-check-input">
                            <label for="opt1" class="form-check-label"><i>MALE</i></label>
                        </div>

                        <div class="form-check">
                            <input type="radio" id="opt2" name="rdbtn" value="Female" class="form-check-input">
                            <label for="opt2" class="form-check-label"><i>FEMALE</i></label>
                        </div>

                        <div class="form-check">
                            <input type="radio" id="opt3" name="rdbtn" value="Other" class="form-check-input">
                            <label for="opt3" class="form-check-label"><i>OTHER</i></label>
                        </div>

                    </div>
                </div>

            </div>

            <!-- EDUCATIONAL QUALIFICATION -->
            <div class="form-section mb-4">

                <h5 class="text-success">Educational Qualification</h5>

                <div class="row g-3">;

                    <div class="col-md-4">
                        <label for="degree">highest qualification</label>
                        <select id="degree" name="degree" class="form-select">
                            <option value="" disabled selected>CHOOSE OPTION</option>
                            <option value="Doctorate">Doctorate (Ph.D.)</option>
                            <option value="Masters">Masters Degree</option>
                            <option value="Bachelor">Bachelor's Degree</option>
                            <option value="Associate">Associate Degree</option>
                            <option value="Diploma">Diploma or ITI</option>
                            <option value="High School">High School Diploma</option>
                            <option value="Matriculation">Matriculation</option>
                            <option value="Below Matriculation">Below Matriculation</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="cname">College / University</label>
                        <input type="text" id="cname" name="cname" class="form-control"
                               placeholder="college name">
                    </div>

                </div>

                <div class="row g-3 mt-3">

                    <div class="col-md-4">
                        <label for="specialization">specialization field</label>
                        <select id="specialization" name="specialization" class="form-select">
                            <option value="" disabled selected>SPECIALIZATION FIELD</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                            <option value="Cybersecurity">Cybersecurity</option>
                            <option value="AWS Services">AWS Services</option>
                            <option value="Machine Learning">Machine Learning</option>
                            <option value="Data Analysis">Data Analysis</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="language">Prior Language</label>
                        <select id="language" name="language" class="form-select">
                            <option value="" disabled selected>CHOOSE LANGUAGE</option>
                            <option value="C">C</option>
                            <option value="C++">C++</option>
                            <option value="C#">C#</option>
                            <option value="Java">Java</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Python">Python</option>
                            <option value="SQL">SQL</option>
                            <option value="R Programming">R Programming</option>
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="Bootstrap">Bootstrap</option>
                            <option value="Oracle">Oracle</option>
                        </select>
                    </div>
                    

                    <div class="col-md-4">
                        <label for="cv_file">Upload CV</label>
                        <input type="file" id="cv_file" name="cv" class="form-control file-input"
                               accept=".pdf,.doc,.docx">
                    </div>

            
                    <div class="col-md-4">
                        <label for="certificate_file">External Certificates</label>
                        <input type="file" id="certificate_file" name="certificate"
                               class="form-control file-input"
                               accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
                    </div>

                </div>

            </div>

            <!-- OPINION -->
            <div class="opinion-section mb-4">
                <label for="text_msg">Write Your Opinion</label>
                <textarea id="text_msg" name="massege" class="form-control"
                          rows="5" maxlength="100"
                          placeholder="Write your opinion here..."></textarea>
            </div>

            <!-- DECLARATION & BUTTONS -->
            <div id="btn_container" class="mt-4">

                <h6><i><b>Note:</b></i></h6>

                <div class="declaration mb-3">
                    <input type="checkbox" id="declaration" name="declaration" class="form-check-input">
                    <label for="declaration" class="declaration-label">
                        I hereby declare that the details and information given above are complete and true
                        to the best of my knowledge.
                    </label>
                </div>

                <div class="button-group d-flex gap-3 flex-wrap">
                    <input type="submit" id="btn1" name="btn1" value="Submit" class="btn btn-primary">
                    <input type="reset" id="btn2" name="btn2" value="Reset" class="btn btn-secondary">
                </div>

            </div>

        </form>

    </div>

</body>

</html>
